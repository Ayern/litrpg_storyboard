name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing tag to build and publish a release for. Leave empty for an
          ordinary CI run.
        type: string

# One run per ref at a time, except that manual runs get a group of their own.
# A dispatch that rebuilds a tag checks that tag out but still reports the
# branch it was started from as github.ref, so sharing the group let a release
# rebuild cancel an in-flight push run (and a push cancel a release rebuild).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Vite 8 needs Node ^20.19 || >=22.12; match the version the build
          # is developed and verified against.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs `tsc && vite build`, so type errors fail the build as well.
      - name: Typecheck and build
        run: npm run build

      # Without this the audit tab's paging and filtering suite would only ever
      # run on a developer's machine.
      - name: Run frontend tests
        run: npm test

  rust:
    name: Rust database tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      # The tauri crate links against webkit and gtk, which the runner does not
      # ship. `cargo test --lib` needs them even though no window is opened.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run tests
        run: cargo test --lib

  package:
    name: Package the desktop app
    runs-on: windows-latest
    # Packaging compiles the release profile with LTO and builds both
    # installers, so it is the slowest job here. Run it where a break would
    # actually ship -- pushes to main and tagged releases -- plus on demand,
    # rather than on every branch push and pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref_type == 'tag'))
    # Publishing a release writes to the repository, so this job alone gets
    # write access; every other job stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # A manual run can name a tag that already exists, so a release can be
          # rebuilt without moving the tag. Empty means the ref that triggered
          # this run.
          ref: ${{ inputs.release_tag }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # The release profile uses LTO with one codegen unit, so compiling it is the
      # slowest part of this job. Cache it, or every run pays that cost again.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds the frontend through `beforeBuildCommand`, then the release binary
      # and every Windows installer. Nothing here is signed, so this proves the
      # packaging still works rather than producing anything shippable.
      - name: Build the desktop bundle
        run: npm run tauri build

      # A zero exit is not proof an installer was produced: a bundler that quietly
      # wrote nothing would otherwise pass this job.
      - name: Check the installers were produced
        shell: pwsh
        run: |
          $patterns = @(
            "src-tauri/target/release/bundle/msi/*.msi",
            "src-tauri/target/release/bundle/nsis/*-setup.exe"
          )
          $missing = @()
          foreach ($pattern in $patterns) {
            $found = @(Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) {
              $missing += $pattern
              continue
            }
            $found | ForEach-Object {
              "{0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "No installer matched: $($missing -join ', ')"
            exit 1
          }

      # Artifacts die with the run; keep a copy on it so the build can be
      # inspected without re-running CI.
      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: litrpg-storyboard-tracker-${{ inputs.release_tag || github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          # The verification step above already fails when a bundle is missing;
          # this keeps the artifact honest too instead of uploading nothing.
          if-no-files-found: error

      # A tagged build is what people download, so give it a release page rather
      # than leaving the installers in a run that eventually ages out.
      - name: Publish the release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # Refuse to touch the repository if the bundler wrote nothing: an
          # empty release would look like a successful build.
          shopt -s nullglob
          assets=(src-tauri/target/release/bundle/msi/*.msi
                  src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ ${#assets[@]} -lt 2 ]; then
            echo "expected an MSI and a setup exe, found: ${assets[*]:-none}" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Rebuilding an existing tag replaces the assets in place.
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "LitRPG Storyboard Tracker $TAG" \
              --generate-notes
          fi
