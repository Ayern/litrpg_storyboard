name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Vite 8 needs Node ^20.19 || >=22.12; match the version the build
          # is developed and verified against.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs `tsc && vite build`, so type errors fail the build as well.
      - name: Typecheck and build
        run: npm run build

      # Without this the audit tab's paging and filtering suite would only ever
      # run on a developer's machine.
      - name: Run frontend tests
        run: npm test

  rust:
    name: Rust database tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      # The tauri crate links against webkit and gtk, which the runner does not
      # ship. `cargo test --lib` needs them even though no window is opened.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run tests
        run: cargo test --lib

  package:
    name: Package the desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # The release profile uses LTO with one codegen unit, so compiling it is the
      # slowest part of this job. Cache it, or every run pays that cost again.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds the frontend through `beforeBuildCommand`, then the release binary
      # and every Windows installer. Nothing here is signed, so this proves the
      # packaging still works rather than producing anything shippable.
      - name: Build the desktop bundle
        run: npm run tauri build

      # A zero exit is not proof an installer was produced: a bundler that quietly
      # wrote nothing would otherwise pass this job.
      - name: Check the installers were produced
        shell: pwsh
        run: |
          $patterns = @(
            "src-tauri/target/release/bundle/msi/*.msi",
            "src-tauri/target/release/bundle/nsis/*-setup.exe"
          )
          $missing = @()
          foreach ($pattern in $patterns) {
            $found = @(Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) {
              $missing += $pattern
              continue
            }
            $found | ForEach-Object {
              "{0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "No installer matched: $($missing -join ', ')"
            exit 1
          }
