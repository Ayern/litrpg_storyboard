[package]
name = "litrpg_storyboard_tracker"
version = "0.2.0"
description = "LitRPG Storyboard Tracker - Local multi-user desktop app for tracking stories, characters, and idea graphs"
authors = ["Chris"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "litrpg_storyboard_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The database layer lives in its own crate so its tests build without Tauri --
# and so without the WebKitGTK/GTK system packages that linking Tauri needs.
[workspace]
members = ["db"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
litrpg-db = { path = "db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.45"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
