[package]
name = "litrpg-db"
version = "0.2.0"
description = "SQLite storage for LitRPG Storyboard Tracker: models, migrations and queries, with no GUI dependency"
authors = ["Chris"]
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
